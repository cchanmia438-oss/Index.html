<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Receiver - Test App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: linear-gradient(135deg, #1e293b, #334155);
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 { font-size: 20px; font-weight: 600; }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #22c55e;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: #1e293b;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: #38bdf8; }
  .stat .lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .toolbar {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  button {
    background: #334155; color: #e2e8f0; border: none;
    padding: 10px 16px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: 0.2s;
  }
  button:hover { background: #475569; }
  button.primary { background: #3b82f6; }
  button.primary:hover { background: #2563eb; }
  button.danger { background: #ef4444; }
  button.danger:hover { background: #dc2626; }
  .sms-list { display: flex; flex-direction: column; gap: 10px; }
  .sms {
    background: #1e293b;
    border-left: 4px solid #3b82f6;
    padding: 14px 16px;
    border-radius: 10px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .sms.new { border-left-color: #22c55e; }
  .sms-header {
    display: flex; justify-content: space-between;
    margin-bottom: 8px; font-size: 12px;
  }
  .sender { color: #38bdf8; font-weight: 600; }
  .time { color: #64748b; }
  .sms-body { font-size: 14px; line-height: 1.5; color: #cbd5e1; word-wrap: break-word; }
  .empty {
    text-align: center; padding: 60px 20px; color: #64748b;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .info-box {
    background: #1e293b; border-radius: 12px; padding: 14px;
    margin-bottom: 16px; font-size: 12px; color: #94a3b8;
    border: 1px solid #334155;
  }
  .info-box code {
    background: #0f172a; padding: 2px 6px; border-radius: 4px;
    color: #38bdf8; font-size: 11px; word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📩 SMS Receiver</h1>
    <div class="status"><span class="dot"></span> Listening</div>
  </header>

  <div class="info-box">
    Webhook URL: <code id="webhookUrl"></code><br>
    <span style="margin-top:6px;display:inline-block;">SMS Forwarder অ্যাপের "Forward to URL" এ এই লিংক দাও</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="total">0</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num" id="today">0</div><div class="lbl">Today</div></div>
    <div class="stat"><div class="num" id="lastTime">—</div><div class="lbl">Last</div></div>
  </div>

  <div class="toolbar">
    <button class="primary" onclick="addTestSMS()">➕ Test SMS</button>
    <button onclick="exportJSON()">⬇ Export</button>
    <button class="danger" onclick="clearAll()">🗑 Clear All</button>
    <button onclick="location.reload()">🔄 Refresh</button>
  </div>

  <div class="sms-list" id="list"></div>
</div>

<script>
const STORAGE_KEY = 'sms_received_data';
let lastCount = 0;

// Load from localStorage
function loadSMS() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch { return []; }
}

function saveSMS(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

// Render
function render() {
  const list = loadSMS();
  const container = document.getElementById('list');
  
  // Stats
  const today = new Date().toDateString();
  const todayCount = list.filter(s => new Date(s.timestamp).toDateString() === today).length;
  document.getElementById('total').textContent = list.length;
  document.getElementById('today').textContent = todayCount;
  document.getElementById('lastTime').textContent = list.length 
    ? new Date(list[0].timestamp).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})
    : '—';

  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><div class="icon">📭</div>এখনো কোনো SMS আসেনি<br><small>Webhook URL সেট করে মেসেজ পাঠাও</small></div>`;
    return;
  }

  container.innerHTML = list.map((sms, i) => `
    <div class="sms ${i === 0 ? 'new' : ''}">
      <div class="sms-header">
        <span class="sender">📱 ${escapeHtml(sms.sender || 'Unknown')}</span>
        <span class="time">${new Date(sms.timestamp).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
      </div>
      <div class="sms-body">${escapeHtml(sms.message || '')}</div>
    </div>
  `).join('');
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// Add SMS
function addSMS(sender, message) {
  const list = loadSMS();
  list.unshift({ sender, message, timestamp: Date.now() });
  // Keep last 500
  if (list.length > 500) list.length = 500;
  saveSMS(list);
  render();
}

// Test button
function addTestSMS() {
  const senders = ['+8801700000000', 'GP', 'Robi', 'BankAlert', 'OTP-Service'];
  const msgs = [
    'আপনার OTP কোড: 483920। ৫ মিনিটের মধ্যে ব্যবহার করুন।',
    'Your account credited with BDT 500.00. Balance: BDT 1250.',
    'প্রিয় গ্রাহক, আপনার ডেটা প্যাক শেষ হয়েছে।',
    'Do not share this code with anyone. Code: 7712',
    'Your OTP is 559901 for login. Valid for 3 minutes.'
  ];
  const s = senders[Math.floor(Math.random()*senders.length)];
  const m = msgs[Math.floor(Math.random()*msgs.length)];
  addSMS(s, m);
}

function exportJSON() {
  const data = loadSMS();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sms-backup-${Date.now()}.json`;
  a.click();
}

function clearAll() {
  if (confirm('সব SMS ডিলিট করবেন?')) {
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
}

// ===== Webhook Handler =====
// SMS Forwarder অ্যাপ সাধারণত GET বা POST দিয়ে ডেটা পাঠায়
// URL params: ?from=xxx&text=xxx&message=xxx&sender=xxx&msg=xxx&body=xxx
function handleIncoming() {
  const params = new URLSearchParams(window.location.search);
  if (params.toString() === '') return false;

  const sender = params.get('from') || params.get('sender') || 
                 params.get('phone') || params.get('number') || 'Unknown';
  const message = params.get('text') || params.get('message') || 
                  params.get('msg') || params.get('body') || 
                  params.get('content') || '';

  if (message) {
    addSMS(sender, message);
    // URL পরিষ্কার করি যাতে reload এ duplicate না হয়
    window.history.replaceState({}, '', window.location.pathname);
    return true;
  }
  return false;
}

// Cross-tab sync (একাধিক ট্যাব খোলা থাকলে)
window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) render();
});

// Polling — অন্য ডিভাইস/ট্যাব থেকে আসা ডেটা ধরার জন্য
setInterval(() => {
  const current = loadSMS().length;
  if (current !== lastCount) {
    lastCount = current;
    render();
  }
}, 2000);

// Init
document.getElementById('webhookUrl').textContent = window.location.origin + window.location.pathname;
handleIncoming();
render();
lastCount = loadSMS().length;
</script>
</body>
</html>
